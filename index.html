<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.ata 髪質改善サロン</title>

    <style>
    .banner-wrap {
        width: 100%;
        height: 60vh;
        overflow: hidden;
        position: relative; 
    }

    @media (max-width: 768px) {
        .banner-wrap {
            height: 35vh;
        }
    }

    .banner-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
    }

    .banner-text {
        position: absolute;
        top: 30px;
        left: 600px;
        
        color: white;
        font-size: 28px;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(0,0,0,0.5);

        z-index: 10;

    }
    </style>

</head>
<body>
    <h2>.ata 髪質改善サロン</h2>

    <div class="banner-wrap">
    <video autoplay loop muted playsinline>
        <source src="hanabira1.mp4">
    </video>

    <div class="banner-text">
        あなたの髪にも、 <br>
        天使の輪を。
    </div>
    </div>

    
</body>
</html>
